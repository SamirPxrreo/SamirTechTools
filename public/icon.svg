<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SamirTechTools">
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="440" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b92ff"/>
      <stop offset="0.5" stop-color="#5a4ff0"/>
      <stop offset="1" stop-color="#3a2bc4"/>
    </linearGradient>
    <radialGradient id="shine" cx="256" cy="20" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ff"/>
    </linearGradient>
    <clipPath id="clip"><rect x="20" y="20" width="472" height="472" rx="120"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#1b1280" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Forma: cuadrado redondeado; fuera de ella todo es transparente -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#shine)"/>
  <rect x="21.5" y="21.5" width="469" height="469" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Monograma ST (trazos con extremos redondeados) -->
  <g transform="translate(-13 20)" fill="none" stroke="url(#glyph)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M230 192C230 166 206 150 178 150C148 150 126 166 126 192C126 218 148 228 180 236C212 244 234 256 234 282C234 308 210 322 180 322C148 322 124 306 122 278"/>
    <path d="M290 150H414M352 150V322"/>
  </g>
</svg>
